name: Build Packages

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/build-packages.yml'
  workflow_dispatch:

jobs:
  build:
    # Our only package for now (uconsole-hello) is arch=('any'), so
    # building on x86_64 is fine and lets us use the official archlinux
    # image (no aarch64 variant exists). When Plan 2 introduces
    # aarch64-specific kernel packages we will switch to an aarch64
    # runner + archlinuxarm-compatible image (or cross-compile).
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install build environment
        run: |
          pacman -Syu --noconfirm base-devel git sudo
          useradd -m -s /bin/bash builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder "$PWD"

      - name: Import signing key and configure loopback pinentry
        env:
          KEY_ASC: ${{ secrets.UCONSOLE_SIGNING_KEY_ASC }}
          KEY_FPR: ${{ secrets.UCONSOLE_SIGNING_KEY_FPR }}
          GPG_PASSPHRASE: ${{ secrets.UCONSOLE_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Build a gpg config under the builder user so makepkg --sign
          # (which shells out to gpg unattended) has a primed agent.
          sudo -u builder mkdir -p /home/builder/.gnupg
          sudo -u builder chmod 700 /home/builder/.gnupg
          sudo -u builder tee /home/builder/.gnupg/gpg-agent.conf >/dev/null <<'EOF'
          allow-loopback-pinentry
          EOF
          sudo -u builder tee /home/builder/.gnupg/gpg.conf >/dev/null <<'EOF'
          pinentry-mode loopback
          use-agent
          EOF
          sudo -u builder gpgconf --launch gpg-agent
          printf '%s' "$KEY_ASC" | sudo -u builder gpg --batch --import
          printf '%s:6:\n' "$KEY_FPR" | sudo -u builder gpg --batch --import-ownertrust
          # Prime the agent cache via a throwaway detach-sign so the
          # passphrase is held in memory for subsequent makepkg --sign
          # invocations.
          printf 'prime' | sudo -u builder env GPG_PASSPHRASE="$GPG_PASSPHRASE" \
            gpg --batch --yes --pinentry-mode loopback \
                --passphrase "$GPG_PASSPHRASE" \
                --local-user "$KEY_FPR" \
                --detach-sign --output /dev/null

      - name: Build and sign every PKGBUILD
        env:
          KEY_FPR: ${{ secrets.UCONSOLE_SIGNING_KEY_FPR }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # Let the builder user own the checkout so makepkg can write
          # src/, pkg/, and the final .pkg.tar.zst into the source dirs.
          chown -R builder:builder .
          for dir in packages/*/; do
            [ -f "${dir}PKGBUILD" ] || continue
            echo "--- Building ${dir}"
            sudo -u builder bash -c "
              cd '${dir}' &&
              makepkg -s --noconfirm --sign --key '${KEY_FPR}'
            "
            mv "${dir}"*.pkg.tar.zst "${dir}"*.pkg.tar.zst.sig artifacts/
          done
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: uconsole-packages
          path: artifacts/
          retention-days: 30
